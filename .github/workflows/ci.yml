name: CI

# Checks every push to main and every pull request: lint, typecheck, unit tests, and the database
# contract tests against Postgres 18 in Docker. It needs no secrets and deploys nothing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version in package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: scripts/test-db.sh
      - run: scripts/check-bundle.sh
